<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ false }}">
<header style="height:64px;background:#FFFFFF;border-bottom:1px solid #DDD7CC;display:flex;justify-content:center;padding:0 32px;box-sizing:border-box">
  <div style="width:100%;max-width:1200px;display:flex;align-items:center;justify-content:space-between">
    <a href="#" style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:24px;color:#1B4332;text-decoration:none">AS'SOUÉ</a>
    <nav aria-label="Principale" style="display:flex;align-items:center;gap:8px">
      <sc-if value="{{ curCatalogue }}" hint-placeholder-val="{{ false }}"><a href="#" aria-current="page" style="white-space:nowrap;display:inline-flex;align-items:center;height:44px;padding:0 12px;color:#1C1F1D;font-weight:600;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px">Catalogue</a></sc-if>
      <sc-if value="{{ notCatalogue }}" hint-placeholder-val="{{ true }}"><a href="#" style="white-space:nowrap;display:inline-flex;align-items:center;height:44px;padding:0 12px;color:#1C1F1D;text-decoration:none" style-hover="text-decoration:underline">Catalogue</a></sc-if>
      <a href="#" aria-current="{{ panierCurrent }}" style="white-space:nowrap;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;color:#1C1F1D;text-decoration:none" style-hover="text-decoration:underline"><span>Panier</span><sc-if value="{{ cart }}" hint-placeholder-val="{{ false }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:#1B4332;color:#FFFFFF;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums">{{ cart }}</span></sc-if></a>
      <sc-if value="{{ client }}" hint-placeholder-val="{{ false }}">
        <a href="#" style="white-space:nowrap;display:inline-flex;align-items:center;height:44px;padding:0 12px;color:#1C1F1D;text-decoration:none" style-hover="text-decoration:underline">Mes commandes</a>
        <button style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 8px;border:none;background:transparent;border-radius:4px;cursor:pointer" style-hover="background:#F1EDE6"><span aria-hidden="true" style="width:32px;height:32px;border-radius:999px;background:#E6EFEA;color:#1B4332;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">A</span><span style="font-size:14px">awa.ouedraogo@example.com</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></button>
        <sc-if value="{{ gap06 }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;min-height:22px;padding:2px 6px;border:1px dashed #8A8F89;border-radius:4px;font-size:12px;font-weight:600;color:#5B615C;background:#FFFFFF;line-height:1.3;white-space:normal;max-width:100%;box-sizing:border-box">[BACKEND GAP] GAP-06 · email seul, pas de profil</span></sc-if>
      </sc-if>
      <sc-if value="{{ visitor }}" hint-placeholder-val="{{ true }}">
        <a href="#" style="flex:none;white-space:nowrap;display:inline-flex;align-items:center;height:40px;padding:0 16px;margin-left:8px;border:1px solid #2D6A4F;border-radius:4px;color:#2D6A4F;font-weight:600;text-decoration:none;font-size:15px" style-hover="background:#E6EFEA">Se connecter</a>
      </sc-if>
    </nav>
  </div>
</header>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ true }}">
<header style="display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 4px 0 16px;background:#FFFFFF;border-bottom:1px solid #DDD7CC;box-sizing:border-box">
  <a href="#" style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:22px;color:#1B4332;text-decoration:none">AS'SOUÉ</a>
  <div style="display:flex;align-items:center">
    <a href="#" style="white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 10px;color:#1C1F1D;text-decoration:none;font-size:15px"><span>Panier</span><sc-if value="{{ cart }}" hint-placeholder-val="{{ false }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:#1B4332;color:#FFFFFF;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums">{{ cart }}</span></sc-if></a>
    <button aria-expanded="false" style="height:48px;padding:0 12px;border:none;background:transparent;font-size:16px;font-weight:600;color:#2D6A4F;cursor:pointer">Menu</button>
  </div>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:64},&quot;desktop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cart&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;client&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;curCatalogue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;curPanier&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      desktop: !!p.desktop, mobile: !p.desktop,
      cart: p.cart || '',
      client: !!p.client, visitor: !p.client,
      curCatalogue: !!p.curCatalogue, notCatalogue: !p.curCatalogue,
      panierCurrent: p.curPanier ? 'page' : undefined,
      gap06: !!p.gap06
    };
  }
}
</script>
</body>
</html>
