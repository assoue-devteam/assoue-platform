spring:
  application:
    name: assoue-platform
  jpa:
    # Sessions fermées en fin de transaction : tout accès lazy hors @Transactional
    # échoue au lieu de générer des requêtes cachées (lot 11, N+1).
    open-in-view: false
  # Rejet propre au-delà de 10 Mo (413 via GlobalExceptionHandler), avant tout décodage.
  # Une photo smartphone (jusqu'à 48 MP, 3 à 8 Mo) passe ; le client redimensionne
  # déjà à 2000 px, ces limites ne concernent que les envois non redimensionnés.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
# Images uploadées (lot 8) : dossier configurable, absolu obligatoire en production.
assoue:
  images:
    dossier: ${ASSOUE_IMAGES_DIR:./uploads}
    largeur-max: 9000
    hauteur-max: 9000
    pixels-max: 50000000
    # Plus grand côté à l'écriture (redimensionnement serveur après normalisation).
    taille-cote-max: 1600
  mail:
    hote: ${ASSOUE_MAIL_HOST:localhost}
    port: ${ASSOUE_MAIL_PORT:25}
    protocol: ${ASSOUE_MAIL_PROTOCOL:smtp}
    utilisateur: ${ASSOUE_MAIL_USERNAME:}
    mot-de-passe: ${ASSOUE_MAIL_PASSWORD:}
    expediteur: ${ASSOUE_MAIL_FROM:no-reply@assoue.bf}
    # Destinataires des alertes métier (collecte, signalement) — séparés par des virgules.
    alertes-destinataires: ${ASSOUE_MAIL_ALERTES_DESTINATAIRES:}
  motdepasse:
    # Clé HMAC pour hacher les codes de réinitialisation. OBLIGATOIRE en production.
    cle-hmac: ${ASSOUE_MOTDEPASSE_CLE_HMAC:cle-hmac-dev-a-remplacer-en-production}
    code-duree-min: 10
    code-essais-max: 5
    jeton-duree-min: 5
    delai-entre-envois-secondes: 300
    plafond-par-heure: 3
    rate-limit-ip-max: 5
    rate-limit-ip-fenetre-secondes: 60
  points:
    # Système de points (récompense signalements) — DÉSACTIVÉ par défaut.
    # Activez après validation manuelle et tests complets.
    actif: false
    points-par-signalement: 10
    plafond-journalier: 3
    plafond-reduction-pourcent: 50
server:
  forward-headers-strategy: framework
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
