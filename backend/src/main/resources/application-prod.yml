spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

paydunya:
  mode: ${PAYDUNYA_MODE}
  master-key: ${PAYDUNYA_MASTER_KEY}
  private-key: ${PAYDUNYA_PRIVATE_KEY}
  token: ${PAYDUNYA_TOKEN}
  callback-url: ${PAYDUNYA_CALLBACK_URL}
  return-url: ${PAYDUNYA_RETURN_URL}
  cancel-url: ${PAYDUNYA_CANCEL_URL}
  store-name: ${PAYDUNYA_STORE_NAME}
