# Mises à jour automatiques des dépendances (correctif plutôt que curatif).
# Les montées majeures Angular restent manuelles (ligne 20.3 verrouillée, cf. docs/quality-baseline.md).
# Les PRs Dependabot ciblent 'develop' pour suivre le flux de travail Git du projet.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [deps, security]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Angular 20.3 exige zone.js ~0.15 (#61) : a monter avec Angular 21.
      - dependency-name: "zone.js"
        versions: [">=0.16.0"]
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/build-angular"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [deps, security]
    ignore:
      # Spring Boot 4 casse la compilation (#40) : migration majeure a faire a la main.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
