services:
  db:
    image: postgres:16
    container_name: assoue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - assoue_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: assoue-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assoue-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # VPS 2 Go : 1 Go de tas suffit (2 décodages image ≈ 300 Mo + appli), le reste pour Postgres/OS.
      JAVA_OPTS: -Xmx1g
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PAYDUNYA_MODE: ${PAYDUNYA_MODE:-test}
      PAYDUNYA_MASTER_KEY: ${PAYDUNYA_MASTER_KEY:-}
      PAYDUNYA_PRIVATE_KEY: ${PAYDUNYA_PRIVATE_KEY:-}
      PAYDUNYA_TOKEN: ${PAYDUNYA_TOKEN:-}
      PAYDUNYA_CALLBACK_URL: ${PAYDUNYA_CALLBACK_URL:-}
      PAYDUNYA_RETURN_URL: ${PAYDUNYA_RETURN_URL:-}
      PAYDUNYA_CANCEL_URL: ${PAYDUNYA_CANCEL_URL:-}
      PAYDUNYA_STORE_NAME: ${PAYDUNYA_STORE_NAME:-}
      ASSOUE_IMAGES_DIR: /app/uploads
      ASSOUE_MAIL_HOST: ${ASSOUE_MAIL_HOST:-smtp-relay.brevo.com}
      ASSOUE_MAIL_PORT: ${ASSOUE_MAIL_PORT:-587}
      ASSOUE_MAIL_PROTOCOL: ${ASSOUE_MAIL_PROTOCOL:-smtp}
      ASSOUE_MAIL_USERNAME: ${ASSOUE_MAIL_USERNAME:-}
      ASSOUE_MAIL_PASSWORD: ${ASSOUE_MAIL_PASSWORD:-}
      ASSOUE_MAIL_FROM: ${ASSOUE_MAIL_FROM:-}
      ASSOUE_MAIL_ALERTES_DESTINATAIRES: ${ASSOUE_MAIL_ALERTES_DESTINATAIRES:-}
      ASSOUE_MOTDEPASSE_CLE_HMAC: ${ASSOUE_MOTDEPASSE_CLE_HMAC:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ~/.m2:/root/.m2 # cache Maven local
      - ./backend/src:/app/src # hot reload du code source
      - ./backend/pom.xml:/app/pom.xml # pom.xml pour Maven
      - ./uploads:/app/uploads # images uploadées (persistées hors rebuild)

volumes:
  assoue_pg_data:
